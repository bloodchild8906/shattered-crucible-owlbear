<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crucible Music Player</title><link rel="stylesheet" href="../shared.css"></head><body><div id="app"><section style="margin:16px;padding:18px;border:1px solid #76674b;border-radius:9px;background:#222f3e"><h2>Opening Music…</h2><p>If this message remains, the extension could not load.</p><button onclick="location.reload()">Retry</button></section></div><script>window.addEventListener("error",function(e){const r=document.getElementById("app");if(r&&r.textContent.includes("Opening"))r.innerHTML="<section style=\"margin:16px;padding:18px;background:#4a292d;border-radius:9px\"><h2>Extension startup error</h2><p>"+String(e.message).replace(/[<>]/g,"")+"</p><button onclick=\"location.reload()\">Retry</button></section>"});window.addEventListener("unhandledrejection",function(e){const r=document.getElementById("app");if(r&&r.textContent.includes("Opening"))r.textContent="Extension startup failed: "+String(e.reason||"Unknown error")})</script><script type="module" src="../shared.js"></script></body></html>
