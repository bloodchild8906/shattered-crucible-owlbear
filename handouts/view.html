<!doctype html><html><head><meta charset="utf-8"><title>Shattered Crucible Handout</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../shared.css"></head><body><header><h1>Shattered Crucible • Handout</h1></header><main><section id="handout">Opening shared handout...</section></main><script>const box=document.getElementById("handout");const esc=s=>String(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));try{let binary=atob(location.hash.slice(1));let bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));let h=JSON.parse(new TextDecoder().decode(bytes));box.innerHTML="<h2>"+esc(h.name)+"</h2><p style='white-space:pre-wrap'>"+esc(h.notes)+"</p>";if(h.url&&/^https:\/\//.test(h.url)){const a=document.createElement("a");a.href=h.url;a.target="_blank";a.rel="noopener noreferrer";a.textContent="Open handout resource";box.append(a)}}catch(e){box.textContent="Invalid or missing handout link."}</script></body></html>
