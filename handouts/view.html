<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shattered Crucible · Shared Handout</title><link rel="stylesheet" href="../suite.css"></head><body><div class="shell"><header class="header"><div class="branding"><div class="sigil">▣</div><div><div class="eyebrow">Shattered Crucible</div><h1>Shared Handout</h1></div></div></header><main class="content"><div id="content" class="panel">Opening your handout…</div><p class="footnote">This is a player-facing copy. Anyone with the link can read it.</p></main></div><script>
const root=document.getElementById("content");root.replaceChildren();
try{
 const raw=atob(location.hash.slice(1));const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));const data=JSON.parse(new TextDecoder().decode(bytes));
 if(!data||typeof data.name!=="string")throw Error("Invalid handout");
 const h=document.createElement("h2");h.textContent=data.name;root.append(h);
 if(typeof data.image==="string"&&/^https:\/\//.test(data.image)){const img=document.createElement("img");img.src=data.image;img.alt=data.name;img.className="artpreview";root.append(img)}
 const p=document.createElement("p");p.style.whiteSpace="pre-wrap";p.textContent=data.notes||"";root.append(p);
 if(typeof data.url==="string"&&/^https:\/\//.test(data.url)){const link=document.createElement("a");link.href=data.url;link.target="_blank";link.rel="noopener noreferrer";link.className="button";link.textContent="Open attached resource ↗";root.append(link)}
}catch(e){root.textContent="This handout link is incomplete or invalid."}
</script></body></html>
