<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shattered Crucible Toolkit</title><style>body{margin:0;background:#141b24;color:#f5e6c8;font:14px/1.5 system-ui}header{padding:15px;background:#27313c;border-bottom:2px solid #b98c48}h1{font:26px Georgia;margin:0;color:#f4c77f}h2{font:21px Georgia;color:#f2d7a4}main{padding:15px;max-width:1100px;margin:auto}nav,.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}button,input,select,textarea{border:1px solid #7a7261;background:#303b47;color:#f6ecd8;border-radius:7px;padding:9px;font:inherit}button{cursor:pointer}button:hover{background:#53616b}button.active{background:#8f642e}input,select,textarea{box-sizing:border-box;width:100%}textarea{min-height:95px}label{display:block;margin:10px 0}section,.card{background:#202a35;padding:15px;border:1px solid #505b66;border-radius:9px;margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.muted{color:#aeb8c2;font-size:12px}.entry{padding:10px;border:1px solid #5b6971;border-radius:7px;margin:8px 0}.entry strong{color:#f4ce90}#map{height:440px;position:relative;overflow:hidden;border:3px solid #b89053;border-radius:9px;touch-action:none;background:radial-gradient(ellipse at 35% 42%,#70805d 0 12%,#496044 24%,#666744 37%,#375968 48%,#16354a 71%,#0e283e 90%)}.pin{position:absolute;transform:translate(-50%,-100%);background:#af4031;border:2px solid #eab96a;color:white;white-space:nowrap;padding:4px 7px;border-radius:24px;touch-action:none}.preview{white-space:pre-wrap;background:#121920;padding:12px;border-radius:8px;overflow:auto;max-height:280px}.steps{display:flex;gap:5px}.steps span{padding:6px;font-size:11px;border-bottom:3px solid #646e77;flex:1}.steps .here{border-color:#f4c77f}.art{height:160px;border-radius:8px;background:radial-gradient(circle at 40% 35%,#f2bd58,#7f412a 35%,#2b323f 75%);display:grid;place-items:center;font-size:54px}.hidden{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}} </style></head><body><header><h1>⚒ The Shattered Crucible</h1><div class="muted" id="status">Owlbear Rodeo • World Atlas • Homebrew Builder • Character Dice</div></header><main><nav id="nav"></nav><div id="view"></div></main>
<script type="module">
let OBR=null,online=false,gm=true;try{let m=await import("https://esm.sh/@owlbear-rodeo/sdk@2.3.0");OBR=m.default;await new Promise(r=>OBR.onReady(r));online=true;gm=(await OBR.player.getRole())==="GM"}catch(e){console.info("Standalone mode",e)}
const KEY="com.shatteredcrucible.toolkit/state",SHEET_KEY="com.dnd-chars-sheet/characters",STORE="shattered-crucible-toolkit-2026";
const types=["Item","Weapon","Armor","Gem","Material","Ingredient","Recipe","Class","Subclass","Species","Background","Feat","Spell","Monster"];
const towns=["Riverford","Stonehollow","Thornewood","Emberwatch","Mistharbor","Ironhollow","Ashenspire","Duskmire","Stormwatch","Sunscar","Frostwarden"];
const lore=["River traders guard secrets beneath a drowned bell.","A dwarven forge drinks ore from a bottomless vein.","A living grove remembers the names of traitors.","The oasis exists because of a bargain with fire.","The smugglers' grotto speaks in the tide.","Heavy-iron dynasties contest an ancient crown.","Gnomish institutes license aetheric experiments.","Unregulated goblin researchers trade dangerous prototypes.","Sea captains fear the stormbound lighthouse.","Caravans shelter from the sun beneath runic stones.","Ice beneath the citadel preserves a prehistoric monster."];
const defaultState={pins:towns.map((name,i)=>({id:"town"+i,name,x:12+(i%4)*24,y:19+Math.floor(i/4)*27,description:lore[i],scene:""})),homebrew:[{id:"h1",type:"Gem",name:"Embershard",rarity:"Rare",description:"Socketed weapon: once per turn deal +1 fire damage.",price:250},{id:"h2",type:"Ingredient",name:"Moonmint",rarity:"Common",description:"Forest herb, +1 to a cooking check involving calming meals.",price:5},{id:"h3",type:"Recipe",name:"Bronze Hearth Stew",rarity:"Common",description:"DC 13 cooking; on success gain 1d4 temporary HP for one hour.",price:12}],characters:[],rolls:[]};
const esc=s=>String(s??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]));const uid=()=>Math.random().toString(36).slice(2);
let state=structuredClone(defaultState),page="atlas",pin=null,kind="Item",step=0,draft={},chosen=null;
try{const v=JSON.parse(localStorage.getItem(STORE));if(v?.pins&&v?.homebrew)state=v}catch{}
async function persist(){localStorage.setItem(STORE,JSON.stringify(state));if(online&&gm){try{await OBR.room.setMetadata({[KEY]:state})}catch(e){alert("Owlbear room metadata limit: export a backup; "+e.message)}}}
if(online){document.getElementById("status").textContent="Connected to Owlbear Rodeo • "+(gm?"GM":"Player");const md=await OBR.room.getMetadata();if(md[KEY]?.pins){state=md[KEY]}OBR.room.onMetadataChange(md=>{if(md[KEY]?.pins){state=md[KEY];render()}})}else document.getElementById("status").textContent="Standalone preview — local saves (connect through Owlbear for room sync)";
const $=id=>document.getElementById(id);
function render(){const nav=[["atlas","World Atlas"],["homebrew","Homebrew Wizards"],["characters","Character Dice"],["gallery","Illustrated Codex"],["backup","Import / Export"]];$("nav").innerHTML=nav.map(([id,name])=>'<button data-page="'+id+'" class="'+(id===page?"active":"")+'">'+name+'</button>').join("");document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});$("view").innerHTML=page==="atlas"?atlas():page==="homebrew"?homebrew():page==="characters"?characters():page==="gallery"?gallery():backup();wire()}
function atlas(){const p=state.pins.find(x=>x.id===pin);return '<section><h2>World Atlas • Draggable Scene Pins</h2><p class="muted">GM: drag pins and save changes; set a scene URL for each location. Scene opening uses links and does not change the room scene automatically.</p><div id="map">'+state.pins.map(x=>'<button class="pin" title="'+esc(x.description)+'" data-pin="'+esc(x.id)+'" style="left:'+x.x+'%;top:'+x.y+'%">'+esc(x.name)+'</button>').join("")+'</div><div class="row"><button id="addPin">Add Pin</button><button id="resetPins">Reset Pins</button></div></section><section>'+(p?'<h2>'+esc(p.name)+'</h2><label>Name<input id="pinName" value="'+esc(p.name)+'"></label><label>Lore<textarea id="pinDesc">'+esc(p.description)+'</textarea></label><label>Scene URL<input id="pinScene" value="'+esc(p.scene)+'"></label><div class="row"><button id="savePin">Save</button><button id="delPin">Delete</button>'+(p.scene?'<a class="button" id="sceneLink" target="_blank" rel="noopener noreferrer" href="'+esc(p.scene)+'">Open scene link ↗</a>':'')+'</div>':'Select a town pin to view lore, edit it, or attach a scene URL.')+'</section>'}
function homebrew(){if(!chosen)return '<section><h2>Homebrew Manager</h2><p>Create a rules entry with a guided, category-specific wizard. Entries can be exported, imported and referenced by stable IDs from dnd-chars-sheet.</p><label>Builder type<select id="kind">'+types.map(x=>'<option '+(x===kind?"selected":"")+'>'+x+'</option>').join("")+'</select></label><button id="startWizard">New '+esc(kind)+' wizard</button><h3>Saved content ('+state.homebrew.length+')</h3>'+state.homebrew.map(x=>'<div class="entry"><strong>'+esc(x.name)+'</strong> <span class="muted">'+esc(x.type)+' • '+esc(x.rarity||"")+'</span><p>'+esc(x.description||"")+'</p><div class="row"><button data-edit="'+x.id+'">Edit wizard</button><button data-remove="'+x.id+'">Delete</button></div></div>').join("")+'</section>';
const steps=["Identity","Mechanics","Rules & Progression","Lore & Art","Review"];return '<section><h2>'+esc(kind)+' Builder</h2><div class="steps">'+steps.map((x,i)=>'<span class="'+(i===step?"here":"")+'">'+(i+1)+'. '+x+'</span>').join("")+'</div>'+wizardFields()+'<div class="row"><button id="prevStep" '+(step===0?"disabled":"")+'>Back</button><button id="nextStep">'+(step===4?"Save Homebrew":"Next Step")+'</button><button id="cancelWizard">Cancel</button></div></section>'}
function field(id,label,ph="",multi=false){return '<label><span>'+label+'</span>'+(multi?'<textarea data-field="'+id+'" placeholder="'+esc(ph)+'">'+esc(draft[id]||"")+'</textarea>':'<input data-field="'+id+'" placeholder="'+esc(ph)+'" value="'+esc(draft[id]||"")+'">')+'</label>'}
function wizardFields(){if(step===0)return field("name","Name (required)")+'<p>Category: <strong>'+esc(kind)+'</strong></p>'+field("rarity","Rarity / rarity tier","Common, Uncommon, Rare...")+field("source","Creator / Source","Shattered Crucible");
if(step===1){let keys=["description","price","weight"];if(["Class","Subclass"].includes(kind))keys=["hitDie","primaryAbility","savingThrows","proficiencies"];if(kind==="Species")keys=["size","speed","languages","traits"];if(kind==="Monster")keys=["challengeRating","armorClass","hitPoints","speed"];if(kind==="Spell")keys=["level","school","castingTime","range"];if(kind==="Recipe")keys=["ingredients","cookDC","portions","duration"];if(kind==="Weapon")keys=["damage","damageType","properties","socketCount"];if(kind==="Armor")keys=["baseAC","armorCategory","material","socketCount"];if(kind==="Gem")keys=["element","socketTier","charges","effect"];return keys.map(k=>field(k,k.replace(/([A-Z])/g," $1"),"",["description","traits","ingredients","effect"].includes(k))).join("")}
if(step===2)return field("mechanics","Features, mechanics, prerequisites and limitations","Describe game effects, triggers and action economy",true)+field("progression","Scaling / class levels / upgrade tiers","Features at each level, or scaling by rarity",true)+field("checks","Checks, DCs, saves and recharge","DC 13 Strength; 1/long rest",true);
if(step===3)return field("lore","Background, origin and setting notes","What makes it unique?",true)+field("image","Image URL (optional)","https://...")+field("tags","Tags","crafting, fire, dwarven",false);
return '<h3>Review before saving</h3><pre class="preview">'+esc(JSON.stringify({type:kind,...draft},null,2))+'</pre><p class="muted">Homebrew mechanics are custom rules requiring DM review and playtesting. Entries store plain descriptions; they are not automatically incorporated into a character sheet.</p>'}
function characters(){return '<section><h2>Character Sheet & Dice Roller</h2><p class="muted">Linked character summaries use a documented shared-data format. The separate dnd-chars-sheet extension must publish records under com.dnd-chars-sheet/characters for automatic sync.</p><button id="refreshChars">Refresh linked sheets</button><div id="charlist">'+state.characters.map(c=>'<div class="entry"><strong>'+esc(c.name)+'</strong> Level '+esc(c.level||"?")+' '+esc(c.className||"")+' <button data-character="'+c.id+'">Select</button></div>').join("")+'</div><h3>Manual character</h3>'+field("unused","", "",false).replace(/<label>[\s\S]*?<\/label>/,'<label>Name<input id="characterName" placeholder="Name"></label>')+'<button id="addCharacter">Add character</button><h3>Roll on sheet</h3><div class="grid"><label>Dice expression<input id="diceExpression" value="1d20+5" placeholder="2d6+3"></label><label>Roll mode<select id="adv"><option value="normal">Normal</option><option value="adv">Advantage</option><option value="dis">Disadvantage</option></select></label></div><label>Roll label<input id="rollLabel" placeholder="Athletics / Longsword / Constitution save"></label><button id="rollDice">Roll Dice</button><h3>Recent results</h3>'+state.rolls.slice(-10).reverse().map(r=>'<div class="entry">'+esc(r.label)+' <strong>'+r.total+'</strong> ('+esc(r.expression)+') • '+esc(r.character||"")+'</div>').join("")+'</section>'}
function gallery(){const icons={"Item":"💍","Weapon":"⚔️","Armor":"🛡️","Gem":"💎","Material":"⚒️","Ingredient":"🌿","Recipe":"🍲","Class":"🧙","Subclass":"🔥","Species":"🐉","Background":"📜","Feat":"✨","Spell":"🔮","Monster":"🐲"};return '<section><h2>Visual Codex</h2><p class="muted">Illustration slots use configured image URLs, with illustrated category symbols as offline fallbacks. Individual creature, class and item portraits can be supplied through each homebrew wizard.</p><div class="grid">'+state.homebrew.map(x=>'<div class="entry"><div class="art">'+(x.image?'<img src="'+esc(x.image)+'" alt="'+esc(x.name)+'" style="max-width:100%;max-height:100%">':icons[x.type]||"📖")+'</div><strong>'+esc(x.name)+'</strong> • '+esc(x.type)+'<p>'+esc(x.description||x.mechanics||"")+'</p></div>').join("")+'</div><h2>Settlement map gallery</h2><p>Open a World Atlas pin to add a direct map or Owlbear scene link. Named towns:</p>'+towns.map((x,i)=>'<div class="entry"><strong>'+esc(x)+'</strong>: '+esc(lore[i])+'</div>').join("")+'</section>'}
function backup(){return '<section><h2>Backup & integration</h2><button id="export">Export JSON</button><label>Import JSON<input id="import" type="file" accept=".json,application/json"></label><h3>Character Sheet Integration Contract</h3><pre class="preview">OBR.room.getMetadata()["com.dnd-chars-sheet/characters"] = [{id,name,level,className,abilities,hitPoints}]\nAtlas shared namespace: com.shatteredcrucible.toolkit/state\nReferences to homebrew: [homebrewId,...]\nAvoid embedding full homebrew objects into character sheets.\n\nCharacter sheet extension must implement the producer side of the contract. This pack never overwrites that namespace.</pre></section>'}
function wire(){
if(page==="atlas"){const map=$("map");document.querySelectorAll("[data-pin]").forEach(el=>{let start=null;el.onpointerdown=e=>{start={x:e.clientX,y:e.clientY};el.setPointerCapture(e.pointerId)};el.onpointermove=e=>{if(!start||!gm)return;const r=map.getBoundingClientRect();el.style.left=Math.max(2,Math.min(98,100*(e.clientX-r.left)/r.width))+"%";el.style.top=Math.max(4,Math.min(98,100*(e.clientY-r.top)/r.height))+"%"};el.onpointerup=e=>{pin=el.dataset.pin;if(start&&gm&&Math.abs(start.x-e.clientX)+Math.abs(start.y-e.clientY)>5){const p=state.pins.find(p=>p.id===pin);p.x=parseFloat(el.style.left);p.y=parseFloat(el.style.top);persist()}start=null;render()}});$("addPin").onclick=()=>{if(!gm)return;let p={id:uid(),name:"New Location",x:50,y:50,description:"",scene:""};state.pins.push(p);pin=p.id;persist();render()};$("resetPins").onclick=()=>{if(confirm("Restore starter pins?")){state.pins=structuredClone(defaultState.pins);pin=null;persist();render()}};if(pin&&state.pins.some(x=>x.id===pin)){$("savePin").onclick=()=>{let p=state.pins.find(x=>x.id===pin);p.name=$("pinName").value;p.description=$("pinDesc").value;p.scene=$("pinScene").value;if(p.scene&&!/^https:\/\//.test(p.scene)){alert("Scene URL must begin with https://");return}persist();render()};$("delPin").onclick=()=>{if(confirm("Delete location?")){state.pins=state.pins.filter(x=>x.id!==pin);pin=null;persist();render()}}}}
if(page==="homebrew"){if(!chosen){$("kind").onchange=e=>{kind=e.target.value};$("startWizard").onclick=()=>{chosen="new";draft={};step=0;render()};document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{let x=state.homebrew.find(h=>h.id===b.dataset.edit);draft={...x};kind=x.type;chosen=x.id;step=0;render()});document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{if(confirm("Delete this homebrew?")){state.homebrew=state.homebrew.filter(x=>x.id!==b.dataset.remove);persist();render()}})}else{document.querySelectorAll("[data-field]").forEach(f=>f.oninput=()=>{draft[f.dataset.field]=f.value});$("prevStep").onclick=()=>{step=Math.max(0,step-1);render()};$("nextStep").onclick=()=>{if(step===0&&!String(draft.name||"").trim()){alert("A name is required.");return}if(step<4){step++;render();return}const item={...draft,id:chosen==="new"?uid():chosen,type:kind};let i=state.homebrew.findIndex(x=>x.id===item.id);if(i>=0)state.homebrew[i]=item;else state.homebrew.push(item);chosen=null;persist();render()};$("cancelWizard").onclick=()=>{chosen=null;render()}}}
if(page==="characters"){$("addCharacter").onclick=()=>{let name=$("characterName").value.trim();if(!name)return;state.characters.push({id:uid(),name,level:5});persist();render()};$("refreshChars").onclick=async()=>{if(!online){alert("Open inside Owlbear for linked room sheets.");return}let md=await OBR.room.getMetadata();let chars=md[SHEET_KEY];if(Array.isArray(chars)){state.characters=chars;persist();render()}else alert("dnd-chars-sheet has not published the character metadata contract yet.")};$("rollDice").onclick=()=>{let exp=$("diceExpression").value.trim().replace(/\s/g,""),match=exp.match(/^(\d{1,2})d(\d{1,4})([+-]\d{1,3})?$/i);if(!match){alert("Use NdM+K format, e.g. 2d6+3 (1–30 dice, 2–1000 sides).");return}let n=+match[1],s=+match[2],mod=+(match[3]||0);if(n<1||n>30||s<2||s>1000)return alert("Dice limits: 1–30 dice, 2–1000 sides.");function roll(){return Array.from({length:n},()=>1+Math.floor(Math.random()*s)).reduce((a,b)=>a+b,0)+mod}let v=roll(),mode=$("adv").value;if(mode!=="normal"){if(n!==1||s!==20)return alert("Advantage/disadvantage only works with a 1d20 roll.");let b=roll();v=mode==="adv"?Math.max(v,b):Math.min(v,b)}let r={expression:exp,total:v,label:$("rollLabel").value||"Dice roll",character:"",at:new Date().toISOString()};state.rolls.push(r);state.rolls=state.rolls.slice(-25);persist();render();}}if(page==="backup"){$("export").onclick=()=>{const a=document.createElement("a"),blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});a.href=URL.createObjectURL(blob);a.download="crucible-campaign.json";a.click();URL.revokeObjectURL(a.href)};$("import").onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data.pins)||!Array.isArray(data.homebrew))throw Error("Invalid campaign structure");state=data;await persist();render()}catch(err){alert(err.message)}}}}
render();
</script></body></html>
